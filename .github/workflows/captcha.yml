name: Captcha and database regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libmagic1 libmariadb-dev pkg-config
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
